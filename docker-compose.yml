services:
  cross-references-predictor:
    container_name: cross-references-predictor
    entrypoint: [ "gunicorn", "-k", "uvicorn.workers.UvicornWorker", "--chdir", "./src", "cross_references_predictor.drivers.rest.app:app", "--bind", "0.0.0.0:5070", "--timeout", "10000"]
    init: true
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=references_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_API_KEY=${OLLAMA_API_KEY}
    networks:
      - network-cross-references-predictor
    ports:
      - "5070:5070"
    depends_on:
      - postgres
      - ollama

  pdf-layout-analysis:
    container_name: "pdf-layout-analysis"
    entrypoint: [ "gunicorn", "-k", "uvicorn.workers.UvicornWorker", "--chdir", "./src", "app:app", "--bind", "0.0.0.0:5060", "--timeout", "10000"]
    image: ghcr.io/huridocs/pdf-document-layout-analysis:0.0.32
    init: true
    restart: unless-stopped
    networks:
      - network-cross-references-predictor
    ports:
      - "5060:5060"

  postgres:
    container_name: postgres
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: references_db
    ports:
      - "5432:5432"
    networks:
      - network-cross-references-predictor
    volumes:
      - postgres_data:/var/lib/postgresql/data

  adminer:
    container_name: adminer
    image: adminer:4
    restart: unless-stopped
    networks:
      - network-cross-references-predictor
    ports:
      - "8080:8080"

  ollama:
    container_name: ollama
    image: ollama/ollama:latest
    init: true
    restart: unless-stopped
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_KEY=${OLLAMA_API_KEY}
    networks:
      - network-cross-references-predictor
    ports:
      - "11434:11434"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "ollama cloud login \"$OLLAMA_KEY\" && ollama serve"

networks:
  network-cross-references-predictor:
    driver: bridge

volumes:
  postgres_data:
